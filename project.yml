name: Muyassir
options:
  bundleIdPrefix: com.muyassir
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ar
targets:
  Muyassir:
    type: application
    platform: iOS
    sources:
      - path: Muyassir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muyassir.app
        PRODUCT_NAME: Muyassir
        INFOPLIST_FILE: Muyassir/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Paper AppIcon-Saffron"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  MuyassirTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MuyassirTests]
    dependencies:
      - target: Muyassir
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Muyassir.app/Muyassir
  MuyassirUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MuyassirUITests
      - path: Muyassir/App/Tools.swift
    dependencies:
      - target: Muyassir
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Muyassir
schemes:
  Muyassir:
    build:
      targets:
        Muyassir: all
        MuyassirTests: [test]
        MuyassirUITests: [test]
    run:
      storeKitConfiguration: Muyassir.storekit
    test:
      targets: [MuyassirTests, MuyassirUITests]
